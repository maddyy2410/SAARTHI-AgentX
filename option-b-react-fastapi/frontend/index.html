<!doctype html>
<!-- index.html : the single HTML page. React draws everything inside <div id="root"> -->
<html lang="en">
  <head>
    <meta charset="UTF-8" /> <!-- support all characters and emoji -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- scale properly on phones -->
    <title>Disaster Command Center</title> <!-- text on the browser tab -->
  </head>
  <body>
    <div id="root"></div> <!-- React puts the whole app here -->
    <script type="module" src="/src/main.jsx"></script> <!-- starts the React code -->
  </body>
</html>
