# Emergency operations centre theme.
# Severity colours stay in app.py as LEVEL_HEX:
# Critical #D9483B, High #E58A35, Moderate #5C7380, Low #238C78.
# The light basemap is selected in app.py.
# A running Streamlit process reads this file only when it starts.

[theme]
base = "light"
primaryColor = "#142B3B"
backgroundColor = "#F3F5F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#263238"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 14
borderColor = "#E1E6E9"
linkColor = "#142B3B"
codeTextColor = "#263238"
headingFontSizes = ["1.2rem", "1.05rem", "0.95rem", "0.9rem", "0.85rem", "0.8rem"]

[theme.sidebar]
backgroundColor = "#142B3B"
secondaryBackgroundColor = "#1B384C"
borderColor = "#1B384C"
