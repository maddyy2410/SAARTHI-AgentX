# Operations-centre theme. Severity colours stay in app.py as LEVEL_HEX:
# Critical #b91c1c, High #d9580d, Moderate #c99a06, Low #2f7d4f.
# Those colours also colour map markers. The dark basemap is selected in app.py.
# A running Streamlit process reads this file only when it starts.

[theme]
base = "dark"
primaryColor = "#8fb4d4"
backgroundColor = "#0b1726"
secondaryBackgroundColor = "#13283c"
textColor = "#e6edf3"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 14
borderColor = "#2a4158"
linkColor = "#c5d4e4"
codeTextColor = "#d5deea"
headingFontSizes = ["1.2rem", "1.05rem", "0.95rem", "0.9rem", "0.85rem", "0.8rem"]

[theme.sidebar]
backgroundColor = "#09131f"
secondaryBackgroundColor = "#102033"
borderColor = "#2a4158"
